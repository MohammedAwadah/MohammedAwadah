name: Refresh GitBanner

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: yashksaini-coder/GitBanner@v1.3.0
        with:
          github-token: ${{ secrets.GITBANNER_PAT }}
          username: MohammedAwadah
          output-path: ./assets/gitbanner
          format: both
          theme: dark
          include-private: false
          commit: true
          commit-message: "chore: refresh GitBanner stats"
