name: Refresh GitBanner

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitBanner
        uses: yashksaini-coder/GitBanner@v1.3.0
        with:
          github-token: ${{ secrets.GITBANNER_PAT }}
          username: MohammedAwadah
          theme: dark
          format: both
          output-path: gitbanner
          commit: true
